<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crazy Colorful Contact Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="contact-card">
        <div class="header">
            <h1>🚀 Let's Connect!</h1>
            <p>Got a wild idea or a crazy project? Drop a message below!</p>
        </div>

        <form action="#" method="POST">
            <!-- Personal Info Section -->
            <div class="form-row">
                <div class="input-field">
                    <label for="fullname">⚡ Full Name</label>
                    <input type="text" id="fullname" placeholder="Alex Morgan" required>
                </div>
                <div class="input-field">
                    <label for="email">📧 Email Address</label>
                    <input type="email" id="email" placeholder="alex@crazymail.com" required>
                </div>
            </div>

            <!-- Details Section -->
            <div class="form-row">
                <div class="input-field">
                    <label for="phone">📞 Phone Number</label>
                    <input type="tel" id="phone" placeholder="+1 (555) 000-1234">
                </div>
                <div class="input-field">
                    <label for="topic">🎯 What's this about?</label>
                    <select id="topic" required>
                        <option value="" disabled selected>Pick a topic</option>
                        <option value="freelance">Freelance Project</option>
                        <option value="job">Job Offer</option>
                        <option value="collaboration">Crazy Collaboration</option>
                        <option value="hello">Just Saying Hi!</option>
                    </select>
                </div>
            </div>

            <!-- Priority & Budget Section -->
            <div class="form-row">
                <div class="input-field">
                    <label for="urgency">🔥 Urgency Level</label>
                    <select id="urgency">
                        <option value="normal">Chill (Take your time)</option>
                        <option value="fast">Fast (Next few days)</option>
                        <option value="urgent">CRITICAL (ASAP! 🔥)</option>
                    </select>
                </div>
                <div class="input-field">
                    <label for="budget">💰 Estimated Budget</label>
                    <input type="text" id="budget" placeholder="$500 - $5,000+">
                </div>
            </div>

            <!-- Message Box -->
            <div class="input-field">
                <label for="message">💬 Your Message</label>
                <textarea id="message" rows="5" placeholder="Spill all the crazy details here..." required></textarea>
            </div>

            <!-- Preferred Contact Method -->
            <div class="radio-section">
                <label class="section-title">✨ Preferred Way to Reply:</label>
                <div class="radio-options">
                    <label class="radio-btn">
                        <input type="radio" name="reply-method" value="email" checked> Email
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="reply-method" value="phone"> Phone
                    </label>
                    <label class="radio-btn">
                        <input type="radio" name="reply-method" value="whatsapp"> WhatsApp
                    </label>
                </div>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="glow-btn">🚀 Send Message!</button>
        </form>
    </div>

</body>
</html>
